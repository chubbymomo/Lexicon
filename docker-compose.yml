# Lexicon: the web app and API with its own Postgres database.
# Copy .env.example to .env, fill it in, then: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexicon
      POSTGRES_DB: lexicon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexicon -d lexicon"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: ./web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lexicon:${POSTGRES_PASSWORD}@db:5432/lexicon
      LEXICON_INVITE_CODE: ${LEXICON_INVITE_CODE:?Set LEXICON_INVITE_CODE in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEXICON_TIMEZONE: ${LEXICON_TIMEZONE:-UTC}
      LEXICON_MAX_USERS: ${LEXICON_MAX_USERS:-}
      LEXICON_SECURE_COOKIES: ${LEXICON_SECURE_COOKIES:-}
    ports:
      - "${LEXICON_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://localhost:3000/api/v1/meta").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  db-data:
